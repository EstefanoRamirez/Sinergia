# Aviso si la web se cae: cada hora revisa la portada y /api/estado.
# (Cada hora y no más seguido: con el repositorio privado, GitHub da 2.000 minutos gratis al mes
#  y esto usa unos 750.)
# Si algo falla, GitHub marca el flujo en rojo y te envía un correo.
# Se activa solo cuando creas la variable del repositorio VIGILAR_URL (por ejemplo https://www.sinergia.ec).
# Ver docs/DESPLIEGUE.md, paso 11.
name: Vigilancia de la web

on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  revisar:
    if: ${{ vars.VIGILAR_URL != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Revisar portada y servidor
        env:
          URL: ${{ vars.VIGILAR_URL }}
        run: |
          set -e
          for ruta in "/" "/webinars" "/api/estado"; do
            ok=0
            for intento in 1 2 3; do
              codigo=$(curl -s -o /dev/null -w "%{http_code}" --max-time 20 "$URL$ruta" || true)
              if [ "$codigo" = "200" ]; then ok=1; break; fi
              sleep 20
            done
            if [ "$ok" != "1" ]; then
              echo "::error::$URL$ruta respondió $codigo"
              exit 1
            fi
            echo "OK $URL$ruta"
          done
